<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Paper.io Territory Battle - JohnPlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0f172a; font-family: 'Segoe UI', system-ui, sans-serif; }
    #canvas { width: 100%; height: 100%; display: block; }
    #ui { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
    .hud { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); border: 1px solid rgba(168, 85, 247, 0.4); border-radius: 12px; padding: 8px 16px; color: #fff; font-weight: bold; font-size: 14px; }
    .hud span { color: #a855f7; font-family: monospace; font-size: 18px; }
    #gameover-screen { position: absolute; inset: 0; background: rgba(0,0,0,0.88); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20; color: white; }
    #gameover-screen h1 { font-size: 40px; color: #f43f5e; font-weight: 900; }
    button { pointer-events: auto; background: linear-gradient(135deg, #a855f7, #38bdf8); color: white; border: none; padding: 12px 28px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 14px; margin-top: 15px; }
    #instructions { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.85); border-radius: 20px; padding: 6px 18px; color: #cbd5e1; font-size: 12px; pointer-events: none; z-index: 10; }
  </style>
</head>
<body>
  <div id="ui">
    <div class="hud">🗺️ TERRITÓRIO: <span id="percent">5.0%</span></div>
    <div class="hud">👑 LÍDER: <span id="rank">#1 Você</span></div>
  </div>

  <div id="instructions">
    Use as [Setas do Teclado] ou [W, A, S, D] para traçar linhas e conquistar o mapa
  </div>

  <div id="gameover-screen">
    <h1>SEU RASTRO FOI CORTADO!</h1>
    <p>Território final conquistado: <strong id="final-pct" style="color:#a855f7">0%</strong></p>
    <button onclick="restart()">CONQUISTAR NOVAMENTE</button>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let W, H;
    const GRID = 40;
    let cols, rows;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      cols = Math.floor(W / GRID);
      rows = Math.floor(H / GRID);
    }
    window.addEventListener('resize', resize);
    resize();

    let p = { x: 10, y: 10, dir: { x: 1, y: 0 }, trail: [], territory: new Set() };
    let bot = { x: 25, y: 15, dir: { x: 0, y: 1 }, trail: [], territory: new Set() };
    let isGameOver = false;

    function initTerritory() {
      p.territory.clear();
      bot.territory.clear();
      p.trail = [];
      bot.trail = [];
      p.x = 8; p.y = 8; p.dir = { x: 1, y: 0 };
      bot.x = Math.floor(cols * 0.7); bot.y = Math.floor(rows * 0.7); bot.dir = { x: 0, y: 1 };

      // Base territory 3x3
      for (let dx = -1; dx <= 1; dx++) {
        for (let dy = -1; dy <= 1; dy++) {
          p.territory.add(`${p.x + dx},${p.y + dy}`);
          bot.territory.add(`${bot.x + dx},${bot.y + dy}`);
        }
      }
      isGameOver = false;
      document.getElementById('gameover-screen').style.display = 'none';
    }

    window.addEventListener('keydown', e => {
      if (['ArrowUp', 'KeyW'].includes(e.code) && p.dir.y === 0) p.dir = { x: 0, y: -1 };
      if (['ArrowDown', 'KeyS'].includes(e.code) && p.dir.y === 0) p.dir = { x: 0, y: 1 };
      if (['ArrowLeft', 'KeyA'].includes(e.code) && p.dir.x === 0) p.dir = { x: -1, y: 0 };
      if (['ArrowRight', 'KeyD'].includes(e.code) && p.dir.x === 0) p.dir = { x: 1, y: 0 };
    });

    let tick = 0;
    function loop() {
      requestAnimationFrame(loop);
      tick++;
      if (tick % 5 === 0 && !isGameOver) {
        update();
      }
      render();
    }

    function update() {
      // Move Player
      p.x += p.dir.x;
      p.y += p.dir.y;
      if (p.x < 0 || p.x >= cols || p.y < 0 || p.y >= rows) {
        triggerGameOver();
        return;
      }

      const pKey = `${p.x},${p.y}`;
      if (!p.territory.has(pKey)) {
        // Self-collision check
        if (p.trail.includes(pKey)) {
          triggerGameOver();
          return;
        }
        p.trail.push(pKey);
      } else if (p.trail.length > 0) {
        // Returned to territory -> Claim all trail
        p.trail.forEach(k => p.territory.add(k));
        p.trail = [];
      }

      // Move Bot AI
      if (Math.random() < 0.15) {
        const dirs = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }];
        bot.dir = dirs[Math.floor(Math.random() * dirs.length)];
      }
      bot.x += bot.dir.x;
      bot.y += bot.dir.y;
      if (bot.x < 0) bot.x = cols - 1;
      if (bot.x >= cols) bot.x = 0;
      if (bot.y < 0) bot.y = rows - 1;
      if (bot.y >= rows) bot.y = 0;

      const botKey = `${bot.x},${bot.y}`;
      if (!bot.territory.has(botKey)) {
        bot.trail.push(botKey);
      } else if (bot.trail.length > 0) {
        bot.trail.forEach(k => bot.territory.add(k));
        bot.trail = [];
      }

      // Bot cuts player trail
      if (p.trail.includes(botKey)) {
        triggerGameOver();
      }

      const pct = ((p.territory.size / (cols * rows)) * 100).toFixed(1);
      document.getElementById('percent').innerText = `${pct}%`;
    }

    function render() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, W, H);

      // Draw Grid
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 0.5;
      for (let x = 0; x < cols; x++) {
        for (let y = 0; y < rows; y++) {
          ctx.strokeRect(x * GRID, y * GRID, GRID, GRID);
        }
      }

      // Draw Player Territory (Cyan)
      ctx.fillStyle = '#0284c7aa';
      p.territory.forEach(key => {
        const [x, y] = key.split(',').map(Number);
        ctx.fillRect(x * GRID, y * GRID, GRID, GRID);
      });

      // Draw Bot Territory (Purple)
      ctx.fillStyle = '#9333eaaa';
      bot.territory.forEach(key => {
        const [x, y] = key.split(',').map(Number);
        ctx.fillRect(x * GRID, y * GRID, GRID, GRID);
      });

      // Draw Player Trail
      ctx.fillStyle = '#38bdf8';
      p.trail.forEach(key => {
        const [x, y] = key.split(',').map(Number);
        ctx.fillRect(x * GRID + 4, y * GRID + 4, GRID - 8, GRID - 8);
      });

      // Draw Bot Trail
      ctx.fillStyle = '#c084fc';
      bot.trail.forEach(key => {
        const [x, y] = key.split(',').map(Number);
        ctx.fillRect(x * GRID + 4, y * GRID + 4, GRID - 8, GRID - 8);
      });

      // Draw Heads
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(p.x * GRID + 2, p.y * GRID + 2, GRID - 4, GRID - 4);
      ctx.fillStyle = '#fbbf24';
      ctx.fillRect(bot.x * GRID + 2, bot.y * GRID + 2, GRID - 4, GRID - 4);
    }

    function triggerGameOver() {
      isGameOver = true;
      const pct = ((p.territory.size / (cols * rows)) * 100).toFixed(1);
      document.getElementById('final-pct').innerText = `${pct}%`;
      document.getElementById('gameover-screen').style.display = 'flex';
    }

    function restart() {
      initTerritory();
    }

    initTerritory();
    loop();
  </script>
</body>
</html>
