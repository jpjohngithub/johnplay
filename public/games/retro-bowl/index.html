<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Retro Bowl Arcade - JohnPlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0f172a; font-family: 'Segoe UI', system-ui, sans-serif; }
    #canvas { width: 100%; height: 100%; display: block; }
    #ui { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
    .hud { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 12px; padding: 8px 16px; color: #fff; font-weight: bold; font-size: 14px; }
    .hud span { color: #38bdf8; font-family: monospace; font-size: 18px; }
    #touchdown-msg { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20; color: white; }
    #touchdown-msg h1 { font-size: 48px; color: #fbbf24; font-weight: 900; }
    button { pointer-events: auto; background: linear-gradient(135deg, #38bdf8, #818cf8); color: white; border: none; padding: 12px 28px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 14px; margin-top: 15px; }
    #instructions { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.85); border-radius: 20px; padding: 6px 18px; color: #cbd5e1; font-size: 12px; pointer-events: none; z-index: 10; }
  </style>
</head>
<body>
  <div id="ui">
    <div class="hud">🏈 PONTUAÇÃO: <span id="score">0</span></div>
    <div class="hud">TOUCHDOWNS: <span id="tds">0</span></div>
  </div>

  <div id="instructions">
    [Setas ⬅️ ➡️ ou Mouse] Mirar Trajetória | [ESPAÇO ou Clique] Lançar Passe para o Recebedor
  </div>

  <div id="touchdown-msg">
    <h1>🏆 TOUCHDOWN!</h1>
    <p>Passe espetacular de 40 jardas!</p>
    <button onclick="nextPlay()">PRÓXIMA JOGADA</button>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let W, H;
    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let score = 0;
    let touchdowns = 0;
    let aimAngle = -Math.PI / 2;
    let qb = { x: 0, y: 0 };
    let ball = { x: 0, y: 0, vx: 0, vy: 0, flying: false };
    let receivers = [];
    let defenders = [];
    let playActive = true;

    function resetField() {
      qb = { x: W / 2, y: H - 90 };
      ball = { x: 0, y: 0, vx: 0, vy: 0, flying: false };
      receivers = [
        { x: W * 0.25, y: H - 90, vx: 1.2, vy: -2.8, caught: false },
        { x: W * 0.75, y: H - 90, vx: -1.2, vy: -3.2, caught: false }
      ];
      defenders = [
        { x: W * 0.35, y: H - 240, vx: 0, vy: 0.8 },
        { x: W * 0.65, y: H - 240, vx: 0, vy: 0.8 }
      ];
      playActive = true;
      document.getElementById('touchdown-msg').style.display = 'none';
    }

    window.addEventListener('mousemove', e => {
      if (!ball.flying && playActive) {
        aimAngle = Math.atan2(e.clientY - qb.y, e.clientX - qb.x);
      }
    });

    window.addEventListener('mousedown', throwBall);
    window.addEventListener('keydown', e => {
      if (e.code === 'Space') throwBall();
      if (['ArrowLeft', 'KeyA'].includes(e.code)) aimAngle -= 0.15;
      if (['ArrowRight', 'KeyD'].includes(e.code)) aimAngle += 0.15;
    });

    function throwBall() {
      if (!ball.flying && playActive) {
        ball = {
          x: qb.x,
          y: qb.y,
          vx: Math.cos(aimAngle) * 9,
          vy: Math.sin(aimAngle) * 9,
          flying: true
        };
      }
    }

    function loop() {
      requestAnimationFrame(loop);
      update();
      render();
    }

    function update() {
      if (!playActive) return;

      receivers.forEach(r => {
        if (!r.caught) {
          r.x += r.vx;
          r.y += r.vy;
        }
      });

      defenders.forEach(d => {
        d.y += d.vy;
      });

      if (ball.flying) {
        ball.x += ball.vx;
        ball.y += ball.vy;

        // Check catches
        receivers.forEach(r => {
          if (Math.hypot(ball.x - r.x, ball.y - r.y) < 28) {
            r.caught = true;
            ball.flying = false;
            touchdowns++;
            score += 150;
            document.getElementById('score').innerText = `${score}`;
            document.getElementById('tds').innerText = `${touchdowns}`;
            playActive = false;
            document.getElementById('touchdown-msg').style.display = 'flex';
          }
        });

        // Incomplete pass
        if (ball.y < 40 || ball.x < 10 || ball.x > W - 10) {
          ball.flying = false;
          setTimeout(resetField, 1000);
        }
      }
    }

    function render() {
      // Grass field
      ctx.fillStyle = '#15803d';
      ctx.fillRect(0, 0, W, H);

      // Yard lines
      ctx.strokeStyle = '#ffffff66';
      ctx.lineWidth = 2;
      for (let y = 80; y < H; y += 70) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }

      // End zone
      ctx.fillStyle = '#b91c1c';
      ctx.fillRect(0, 0, W, 80);
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('🏈 TOUCHDOWN ZONE 🏈', W / 2, 48);

      // Aim Line
      if (!ball.flying && playActive) {
        ctx.strokeStyle = '#fbbf24';
        ctx.setLineDash([8, 8]);
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(qb.x, qb.y);
        ctx.lineTo(qb.x + Math.cos(aimAngle) * 120, qb.y + Math.sin(aimAngle) * 120);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Quarterback (Blue)
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(qb.x - 12, qb.y - 12, 24, 24);

      // Receivers (Blue)
      receivers.forEach(r => {
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(r.x - 10, r.y - 10, 20, 20);
      });

      // Defenders (Red)
      defenders.forEach(d => {
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(d.x - 10, d.y - 10, 20, 20);
      });

      // Football
      if (ball.flying) {
        ctx.fillStyle = '#78350f';
        ctx.beginPath(); ctx.arc(ball.x, ball.y, 8, 0, Math.PI * 2); ctx.fill();
      }
    }

    function nextPlay() {
      resetField();
    }

    resetField();
    loop();
  </script>
</body>
</html>
